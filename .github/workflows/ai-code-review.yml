name: AI Code Review
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      DEVKIT_READ_TOKEN:
        required: false

jobs:
  spec-conformance:
    name: Spec Conformance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Verify Anthropic auth is configured
        env:
          HAS_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_AUTH" != "true" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set (empty counts as unset). Configure one as an org or repo secret, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Extract spec reference from PR body
        id: spec-ref
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # Accepted forms (the FIRST 'Spec:' occurrence in the body wins;
          # backticks are tolerated and stripped — TRU-4009):
          #   Spec: TRU-XXXX-<feature-name>   canonical: devkit change folder
          #   Spec: <repo-relative-path>      spec/design doc (or folder holding
          #                                   hltc.md/bugfix-spec.md) in THIS
          #                                   repo's checkout (TRU-4009 rider 2:
          #                                   teams that brainstorm in-repo)
          #   Spec: openspec/...              devkit path, mapped to its
          #                                   change-folder name
          #   Spec: none — <reason>           explicit opt-out, passes visibly
          # A MISSING marker hard-fails: it used to SKIP the job, which sat
          # beside green checks and read as benign (TRU-4009).
          if ! printf '%s' "$PR_BODY" | grep -q 'Spec:'; then
            echo "::error::No 'Spec:' marker found in the PR body. Every PR needs one: write 'Spec: TRU-XXXX-<change-folder-name>' — the bare folder name under openspec/changes/, no path, no backticks (the PR-body template in truckbays-devkit ai-specs/.commands/deploy-feature.md step 6 emits it correctly) — or a repo-relative path to an in-repo spec. For a deliberately spec-less PR (CI pin bump, revert) write 'Spec: none — <reason>'. Note: editing the PR body does NOT re-run this check ('edited' is not a trigger, and 'gh run rerun' replays the stale payload) — push an empty commit to re-fire it."
            exit 1
          fi
          # First occurrence only: prose may legitimately MENTION 'Spec:' again
          # further down (TRU-4009 rider 1 — truckbays-api PR 1545 broke on
          # exactly that, with a multi-line capture masquerading as one ref).
          RAW=$(printf '%s' "$PR_BODY" | grep -m1 -oP 'Spec:\s*\K.*' | head -n1 || true)
          # Normalize: drop CR (GitHub bodies are CRLF), strip backticks, take
          # the first whitespace-delimited token.
          CLEANED=${RAW//$'\r'/}
          CLEANED=${CLEANED//\`/}
          read -r SPEC_REF _ <<<"$CLEANED" || true
          SPEC_REF=${SPEC_REF:-}
          reject() { # $1 = reason. %q makes newlines/tabs in the capture visible.
            printf '::error::Invalid spec reference (%s) — raw capture (escapes visible): %q. Expected the bare change-folder name (e.g. Spec: TRU-3997-staff-invoice-mailing-address), a repo-relative path to an in-repo spec, or Spec: none — <reason>. Template: ai-specs/.commands/deploy-feature.md step 6 in truckbays-devkit. Editing the PR body does NOT re-run this check — push an empty commit to re-fire it.\n' "$1" "$RAW"
            exit 1
          }
          if [ "${SPEC_REF,,}" = "none" ]; then
            echo "::notice::'Spec: none' — conformance review explicitly skipped by the PR author. Use only for PRs that genuinely have no spec (CI pin bumps, reverts)."
            echo "spec_ref=" >> "$GITHUB_OUTPUT"
            echo "spec_kind=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$SPEC_REF" == */* ]]; then
            # Path form. Safety first: this value is used in local file checks
            # (and, on the devkit fallback, reduced to a charset-safe name).
            [[ "$SPEC_REF" =~ ^[A-Za-z0-9._/-]+$ ]] || reject "illegal characters in path"
            [[ "$SPEC_REF" == /* ]] && reject "absolute paths not allowed"
            [[ "/$SPEC_REF/" == *"/../"* ]] && reject "'..' segments not allowed"
            SPEC_REF=${SPEC_REF#./}
            if [ -e "$SPEC_REF" ]; then
              # In-repo spec: the doc (or change folder) lives in this repo.
              echo "::notice::Spec reference resolves in-repo: '${SPEC_REF}'."
              echo "spec_ref=$SPEC_REF" >> "$GITHUB_OUTPUT"
              echo "spec_kind=repo" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Devkit-shaped path: map to its change-folder component
            # ([YYYY-MM-DD-]TRU-NNNN-<name>, date prefix dropped so archived
            # refs still resolve through the normal archive lookup).
            MAPPED=""
            IFS='/' read -ra PARTS <<<"$SPEC_REF"
            for part in "${PARTS[@]}"; do
              if [[ "$part" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2}-)?(TRU-[0-9]+[A-Za-z0-9._-]*)$ ]]; then
                MAPPED="${BASH_REMATCH[2]}"
                break
              fi
            done
            [ -n "$MAPPED" ] || reject "path not found in this repo and no TRU-XXXX change-folder component to map to the devkit"
            echo "::notice::Spec reference was written as a devkit path; using change-folder name '${MAPPED}'. Canonical form: 'Spec: ${MAPPED}'."
            SPEC_REF="$MAPPED"
          fi
          [[ "$SPEC_REF" =~ ^[A-Za-z0-9._-]+$ ]] || reject "illegal characters"
          echo "spec_ref=$SPEC_REF" >> "$GITHUB_OUTPUT"
          echo "spec_kind=devkit" >> "$GITHUB_OUTPUT"

      - name: Resolve in-repo spec
        id: resolve-repo
        if: steps.spec-ref.outputs.spec_kind == 'repo'
        env:
          SPEC_REF: ${{ steps.spec-ref.outputs.spec_ref }}
        run: |
          if [ -f "$SPEC_REF" ]; then
            cp "$SPEC_REF" /tmp/hltc.md
          elif [ -f "$SPEC_REF/hltc.md" ]; then
            cp "$SPEC_REF/hltc.md" /tmp/hltc.md
          elif [ -f "$SPEC_REF/bugfix-spec.md" ]; then
            cp "$SPEC_REF/bugfix-spec.md" /tmp/hltc.md
          else
            echo "::error::In-repo spec '$SPEC_REF' is a directory holding neither hltc.md nor bugfix-spec.md."
            exit 1
          fi
          [ -s /tmp/hltc.md ] || { echo "::error::In-repo spec '$SPEC_REF' is empty."; exit 1; }
          echo "Resolved in-repo spec '$SPEC_REF'."

      - name: Check DEVKIT_READ_TOKEN availability
        id: check-token
        if: steps.spec-ref.outputs.spec_kind == 'devkit'
        env:
          HAS_TOKEN: ${{ secrets.DEVKIT_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEVKIT_READ_TOKEN not provided — skipping HLTC fetch and spec conformance review."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch spec contract from devkit
        id: fetch-spec
        if: steps.spec-ref.outputs.spec_kind == 'devkit' && steps.check-token.outputs.available == 'true'
        run: |
          # Tier 2 changes ship hltc.md; Tier 1 changes ship bugfix-spec.md instead.
          # The [ -s ] guard rejects an empty download so a 404 body never counts as success.
          # SPEC_REF arrives via env (never inline-interpolated into the script) and is
          # charset-validated upstream to ^[A-Za-z0-9._-]+$.
          fetch() { # $1 = change folder path from repo root, $2 = contract filename
            local err
            if ! err=$(gh api "repos/truckbay/truckbays-devkit/contents/$1/$2" \
              --jq '.content' 2>&1 >/tmp/hltc.b64); then
              # Only a 404 means "contract absent here" and may fall through to the
              # archive; any other API failure must surface, never masquerade as a miss.
              if printf '%s' "$err" | grep -q 'HTTP 404'; then
                return 1
              fi
              echo "::error::GitHub API failure fetching $1/$2 (not a 404): $err"
              exit 1
            fi
            base64 -d < /tmp/hltc.b64 > /tmp/hltc.md 2>/dev/null
            [ -s /tmp/hltc.md ]
          }
          resolve() { # $1 = change folder path from repo root
            if fetch "$1" hltc.md; then
              echo "Fetched $1/hltc.md (Tier 2 contract)."
            elif fetch "$1" bugfix-spec.md; then
              echo "Fetched $1/bugfix-spec.md (Tier 1 contract)."
            else
              return 1
            fi
          }
          if resolve "openspec/changes/${SPEC_REF}"; then
            echo "spec_state=live" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Archived changes move to openspec/archive/<YYYY-MM-DD>-<name>/ once the
          # implementation PR merges; follow-up PRs on the same ticket still name <name>.
          # Given the upstream charset validation, '.' is SPEC_REF's only regex metachar.
          REF_RE=$(printf '%s' "$SPEC_REF" | sed 's/\./\\./g')
          if ! ARCHIVE_LIST=$(gh api "repos/truckbay/truckbays-devkit/contents/openspec/archive" \
            --jq '.[].name' 2>&1); then
            if printf '%s' "$ARCHIVE_LIST" | grep -q 'HTTP 404'; then
              ARCHIVE_LIST="" # no archive directory at all — same as no match
            else
              echo "::error::GitHub API failure listing openspec/archive: $ARCHIVE_LIST"
              exit 1
            fi
          fi
          ARCHIVED=$(printf '%s\n' "$ARCHIVE_LIST" \
            | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}-${REF_RE}$" | sort | tail -n 1)
          if [ -n "$ARCHIVED" ] && resolve "openspec/archive/${ARCHIVED}"; then
            echo "::notice::Spec '${SPEC_REF}' resolved from the ARCHIVE (${ARCHIVED}): this PR follows up on a change that already shipped, so divergences from the contract are expected amendments."
            echo "spec_state=archived" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither hltc.md nor bugfix-spec.md found for '${SPEC_REF}' on truckbays-devkit main (checked openspec/changes/ and openspec/archive/)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.DEVKIT_READ_TOKEN }}
          SPEC_REF: ${{ steps.spec-ref.outputs.spec_ref }}

      - name: Claude Code spec conformance review
        if: steps.spec-ref.outputs.spec_ref != '' && (steps.spec-ref.outputs.spec_kind == 'repo' || steps.check-token.outputs.available == 'true')
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are a spec-conformance reviewer. Review this PR against the
            approved contract at /tmp/hltc.md (a Tier 2 High-Level Technical
            Contract, a Tier 1 bugfix spec, or an in-repo spec/design doc —
            same authority either way).

            The contract's lifecycle state is "${{ steps.spec-ref.outputs.spec_kind == 'repo' && 'in-repo' || steps.fetch-spec.outputs.spec_state }}".
            "live" means the change is still open: review as usual.
            "archived" means the change already shipped and this PR is a
            follow-up amending it: divergences from the shipped contract are
            expected amendments, not suspicious — still list every discrepancy
            so the reviewer can judge them.
            "in-repo" means the contract lives in this repository itself
            (a spec or design doc authored beside the code): review as usual,
            but the doc may be a design doc rather than a formal HLTC — hold
            the PR to what the doc actually specifies, no more.

            Check:
            1. All requirements from the HLTC are implemented
            2. No behavior beyond the approved contract was introduced
            3. Error handling matches the spec
            4. Input/output shapes match the spec
            5. Architectural placement matches the spec

            Report ONLY discrepancies. Do NOT evaluate code style or quality
            (CodeRabbit handles that).

            ALWAYS publish your result before finishing: update the Claude
            tracking comment on this PR (mcp__github_comment__update_claude_comment)
            so its final content starts with "## Spec Conformance Review"
            ("## Spec Conformance Review (archived spec)" when the state is
            "archived") and lists every discrepancy. If everything conforms,
            set the comment body to exactly "Spec conformance: PASS" — or
            "Spec conformance: PASS (archived spec)" when the state is
            "archived". Never finish without updating the comment.
