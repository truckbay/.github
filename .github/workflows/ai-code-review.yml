name: AI Code Review
on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      DEVKIT_READ_TOKEN:
        required: false

jobs:
  spec-conformance:
    name: Spec Conformance Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    if: contains(github.event.pull_request.body, 'Spec:')
    steps:
      - name: Verify Anthropic auth is configured
        env:
          HAS_AUTH: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          if [ "$HAS_AUTH" != "true" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set (empty counts as unset). Configure one as an org or repo secret, then re-run."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Extract spec reference from PR body
        id: spec-ref
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          SPEC_REF=$(echo "$PR_BODY" | grep -oP 'Spec:\s*\K\S+' || echo "")
          if [ -n "$SPEC_REF" ] && ! [[ "$SPEC_REF" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid spec reference format: '$SPEC_REF'"
            exit 1
          fi
          echo "spec_ref=$SPEC_REF" >> "$GITHUB_OUTPUT"
          if [ -z "$SPEC_REF" ]; then
            echo "No spec reference found in PR body. Skipping conformance check."
            exit 0
          fi

      - name: Check DEVKIT_READ_TOKEN availability
        id: check-token
        if: steps.spec-ref.outputs.spec_ref != ''
        env:
          HAS_TOKEN: ${{ secrets.DEVKIT_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEVKIT_READ_TOKEN not provided — skipping HLTC fetch and spec conformance review."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch spec contract from devkit
        id: fetch-spec
        if: steps.spec-ref.outputs.spec_ref != '' && steps.check-token.outputs.available == 'true'
        run: |
          # Tier 2 changes ship hltc.md; Tier 1 changes ship bugfix-spec.md instead.
          # The [ -s ] guard rejects an empty download so a 404 body never counts as success.
          # SPEC_REF arrives via env (never inline-interpolated into the script) and is
          # charset-validated upstream to ^[A-Za-z0-9._-]+$.
          fetch() { # $1 = change folder path from repo root, $2 = contract filename
            local err
            if ! err=$(gh api "repos/truckbay/truckbays-devkit/contents/$1/$2" \
              --jq '.content' 2>&1 >/tmp/hltc.b64); then
              # Only a 404 means "contract absent here" and may fall through to the
              # archive; any other API failure must surface, never masquerade as a miss.
              if printf '%s' "$err" | grep -q 'HTTP 404'; then
                return 1
              fi
              echo "::error::GitHub API failure fetching $1/$2 (not a 404): $err"
              exit 1
            fi
            base64 -d < /tmp/hltc.b64 > /tmp/hltc.md 2>/dev/null
            [ -s /tmp/hltc.md ]
          }
          resolve() { # $1 = change folder path from repo root
            if fetch "$1" hltc.md; then
              echo "Fetched $1/hltc.md (Tier 2 contract)."
            elif fetch "$1" bugfix-spec.md; then
              echo "Fetched $1/bugfix-spec.md (Tier 1 contract)."
            else
              return 1
            fi
          }
          if resolve "openspec/changes/${SPEC_REF}"; then
            echo "spec_state=live" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Archived changes move to openspec/archive/<YYYY-MM-DD>-<name>/ once the
          # implementation PR merges; follow-up PRs on the same ticket still name <name>.
          # Given the upstream charset validation, '.' is SPEC_REF's only regex metachar.
          REF_RE=$(printf '%s' "$SPEC_REF" | sed 's/\./\\./g')
          if ! ARCHIVE_LIST=$(gh api "repos/truckbay/truckbays-devkit/contents/openspec/archive" \
            --jq '.[].name' 2>&1); then
            if printf '%s' "$ARCHIVE_LIST" | grep -q 'HTTP 404'; then
              ARCHIVE_LIST="" # no archive directory at all — same as no match
            else
              echo "::error::GitHub API failure listing openspec/archive: $ARCHIVE_LIST"
              exit 1
            fi
          fi
          ARCHIVED=$(printf '%s\n' "$ARCHIVE_LIST" \
            | grep -E "^[0-9]{4}-[0-9]{2}-[0-9]{2}-${REF_RE}$" | sort | tail -n 1)
          if [ -n "$ARCHIVED" ] && resolve "openspec/archive/${ARCHIVED}"; then
            echo "::notice::Spec '${SPEC_REF}' resolved from the ARCHIVE (${ARCHIVED}): this PR follows up on a change that already shipped, so divergences from the contract are expected amendments."
            echo "spec_state=archived" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Neither hltc.md nor bugfix-spec.md found for '${SPEC_REF}' on truckbays-devkit main (checked openspec/changes/ and openspec/archive/)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.DEVKIT_READ_TOKEN }}
          SPEC_REF: ${{ steps.spec-ref.outputs.spec_ref }}

      - name: Claude Code spec conformance review
        if: steps.spec-ref.outputs.spec_ref != '' && steps.check-token.outputs.available == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          claude_args: |
            --allowedTools "mcp__github_comment__update_claude_comment,mcp__github_inline_comment__create_inline_comment"
          prompt: |
            You are a spec-conformance reviewer. Review this PR against the
            approved contract at /tmp/hltc.md (a Tier 2 High-Level Technical
            Contract, or a Tier 1 bugfix spec — same authority either way).

            The contract's lifecycle state is "${{ steps.fetch-spec.outputs.spec_state }}".
            "live" means the change is still open: review as usual.
            "archived" means the change already shipped and this PR is a
            follow-up amending it: divergences from the shipped contract are
            expected amendments, not suspicious — still list every discrepancy
            so the reviewer can judge them.

            Check:
            1. All requirements from the HLTC are implemented
            2. No behavior beyond the approved contract was introduced
            3. Error handling matches the spec
            4. Input/output shapes match the spec
            5. Architectural placement matches the spec

            Report ONLY discrepancies. Do NOT evaluate code style or quality
            (CodeRabbit handles that).

            ALWAYS publish your result before finishing: update the Claude
            tracking comment on this PR (mcp__github_comment__update_claude_comment)
            so its final content starts with "## Spec Conformance Review"
            ("## Spec Conformance Review (archived spec)" when the state is
            "archived") and lists every discrepancy. If everything conforms,
            set the comment body to exactly "Spec conformance: PASS" — or
            "Spec conformance: PASS (archived spec)" when the state is
            "archived". Never finish without updating the comment.
